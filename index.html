<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Asistencia QR</title>

<!-- Lector QR -->
<script
src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f3f6;
    color: #222;
}

header {
    background: #24577f;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 8px 0 0;
    font-size: 18px;
}

.contenedor {
    width: 95%;
    max-width: 600px;
    margin: auto;
    padding: 20px 0;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,.12);
}

#reader {
    width: 100%;
    min-height: 280px;
    border-radius: 15px;
    overflow: hidden;
}

#reader video {
    width: 100% !important;
    border-radius: 15px;
}

.estado {
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    margin: 18px 0;
}

button {
    width: 100%;
    padding: 17px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    background: #24577f;
    color: white;
    font-size: 19px;
    font-weight: bold;
}

button:active {
    transform: scale(.98);
}

#btnDetener {
    background: #a83232;
    display: none;
}

.resultado {
    display: none;
    margin-top: 20px;
    padding: 22px;
    border-radius: 18px;
    text-align: center;
}

.entrada {
    background: #d9f5df;
    color: #14652a;
}

.salida {
    background: #dcecff;
    color: #17558f;
}

.error {
    background: #ffe0e0;
    color: #9b111e;
}

.nombre {
    font-size: 25px;
    font-weight: bold;
}

.grupo {
    font-size: 18px;
    margin-top: 6px;
}

.tipo {
    font-size: 23px;
    font-weight: bold;
    margin-top: 15px;
}

.hora {
    font-size: 35px;
    font-weight: bold;
    margin: 10px 0;
}

.mensaje {
    font-size: 17px;
}

.info {
    margin-top: 18px;
    padding: 15px;
    background: #eef3f7;
    border-radius: 12px;
    font-size: 14px;
    word-break: break-word;
}

</style>

</head>


<body>


<header>

<h1>📋 Asistencia QR</h1>

<p>Escanea el código del alumno</p>

</header>


<div class="contenedor">


<div class="card">

<div id="reader"></div>

<div
id="estado"
class="estado"
>
Pulsa el botón para activar la cámara.
</div>


<button
id="btnCamara"
onclick="iniciarCamara()"
>
📷 ACTIVAR CÁMARA
</button>


<button
id="btnDetener"
onclick="detenerCamara()"
>
⛔ DETENER CÁMARA
</button>


<div
id="resultado"
class="resultado"
>

<div
id="nombre"
class="nombre"
></div>

<div
id="grupo"
class="grupo"
></div>

<div
id="tipo"
class="tipo"
></div>

<div
id="hora"
class="hora"
></div>

<div
id="mensaje"
class="mensaje"
></div>

</div>


<div class="info">

<strong>Diagnóstico:</strong>

<div id="diagnostico">
Esperando activación...
</div>

</div>

</div>

</div>


<script>


/************************************************
 * CONFIGURACIÓN
 ************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbx-4mrlsS2DVgI9ZOJSStLLPuF3dDGDq-RX7dXIl_5GAevZyhmEGBbR3MICsSBMukgO/exec";


/************************************************
 * VARIABLES
 ************************************************/

let scanner = null;

let camaraActiva = false;

let procesando = false;

let ultimoCodigo = "";

let ultimoTiempo = 0;


/************************************************
 * ELEMENTOS
 ************************************************/

const estado =
document.getElementById("estado");

const diagnostico =
document.getElementById("diagnostico");

const btnCamara =
document.getElementById("btnCamara");

const btnDetener =
document.getElementById("btnDetener");


/************************************************
 * INICIAR CÁMARA
 ************************************************/

async function iniciarCamara() {

    if (camaraActiva) {
        return;
    }


    diagnostico.innerHTML =
        "Comprobando navegador...";


    /*
     * Comprobar HTTPS
     */

    if (
        location.protocol !== "https:" &&
        location.hostname !== "localhost"
    ) {

        mostrarError(
            "La cámara requiere HTTPS."
        );

        diagnostico.innerHTML =
            "❌ El sitio no está usando HTTPS.";

        return;
    }


    /*
     * Comprobar soporte
     */

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        mostrarError(
            "Este navegador no permite acceder a la cámara."
        );

        diagnostico.innerHTML =
            "❌ getUserMedia no está disponible.";

        return;
    }


    estado.innerText =
        "⏳ Solicitando permiso de cámara...";


    diagnostico.innerHTML =
        "Solicitando permiso a Android...";


    /*
     * SOLICITAR PERMISO EXPLÍCITAMENTE
     */

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },
                audio: false
            });


        /*
         * El permiso fue concedido.
         */

        stream
            .getTracks()
            .forEach(track => track.stop());


        diagnostico.innerHTML =
            "✅ Permiso de cámara concedido.";


    } catch (error) {

        console.error(error);


        diagnostico.innerHTML =
            "❌ Error: " +
            error.name +
            "<br>" +
            (error.message || "");


        if (error.name === "NotAllowedError") {

            mostrarError(
                "Android bloqueó el acceso a la cámara. " +
                "Pulsa el icono de controles de la página " +
                "y permite Cámara."
            );

        }

        else if (
            error.name === "NotFoundError"
        ) {

            mostrarError(
                "No se encontró ninguna cámara."
            );

        }

        else if (
            error.name === "NotReadableError"
        ) {

            mostrarError(
                "La cámara está siendo utilizada por otra aplicación."
            );

        }

        else {

            mostrarError(
                "No se pudo acceder a la cámara: " +
                error.name
            );
        }

        return;
    }


    /*
     * Iniciar lector QR
     */

    try {

        scanner =
            new Html5Qrcode("reader");


        const config = {

            fps: 10,

            qrbox: function(
                width,
                height
            ) {

                const size =
                    Math.floor(
                        Math.min(
                            width,
                            height
                        ) * 0.70
                    );

                return {
                    width: size,
                    height: size
                };
            },

            aspectRatio: 1.0

        };


        await scanner.start(

            {
                facingMode: "environment"
            },

            config,

            codigoDetectado,

            errorLectura

        );


        camaraActiva = true;


        estado.innerText =
            "📷 Cámara activa. Escanea el QR.";


        diagnostico.innerHTML =
            "✅ Cámara trasera activa.";


        btnCamara.style.display =
            "none";


        btnDetener.style.display =
            "block";


    } catch (error) {

        console.error(error);


        diagnostico.innerHTML =
            "❌ No se pudo iniciar el lector.<br>" +
            error;


        mostrarError(
            "La cámara tiene permiso, pero el lector QR no pudo iniciarse."
        );
    }

}


/************************************************
 * QR DETECTADO
 ************************************************/

function codigoDetectado(texto) {

    const ahora =
        Date.now();


    /*
     * Evitar lecturas repetidas
     */

    if (
        procesando ||
        (
            texto === ultimoCodigo &&
            ahora - ultimoTiempo < 5000
        )
    ) {

        return;
    }


    ultimoCodigo =
        texto;

    ultimoTiempo =
        ahora;

    procesando =
        true;


    estado.innerText =
        "⏳ Registrando asistencia...";


    /*
     * Comprobar formato
     */

    if (
        !texto.startsWith(
            "ASISTENCIA|"
        )
    ) {

        mostrarError(
            "QR no válido para este sistema."
        );

        procesando =
            false;

        estado.innerText =
            "📷 Escanea un QR válido.";

        return;
    }


    const partes =
        texto.split("|");


    const id =
        partes[1];


    if (!id) {

        mostrarError(
            "El QR no contiene un ID."
        );

        procesando =
            false;

        return;
    }


    registrar(id);

}


/************************************************
 * REGISTRAR EN APPS SCRIPT
 ************************************************/

function registrar(id) {


    /*
     * JSONP
     */

    const callback =
        "respuesta_" +
        Date.now();


    window[callback] =
        function(respuesta) {


            console.log(
                "Respuesta:",
                respuesta
            );


            mostrarResultado(
                respuesta
            );


            setTimeout(
                function() {

                    procesando =
                        false;

                    estado.innerText =
                        "📷 Escanea el siguiente QR.";

                },
                3000
            );


            try {
                delete window[callback];
            } catch(e) {}

        };


    const script =
        document.createElement(
            "script"
        );


    script.src =
        API_URL +
        "?action=registrar" +
        "&id=" +
        encodeURIComponent(id) +
        "&callback=" +
        callback;


    script.onerror =
        function() {

            mostrarError(
                "No se pudo conectar con Google Apps Script."
            );


            diagnostico.innerHTML =
                "❌ Error de conexión con Apps Script.";


            procesando =
                false;


            estado.innerText =
                "📷 Escanea nuevamente.";

        };


    document.body.appendChild(
        script
    );

}


/************************************************
 * RESULTADO
 ************************************************/

function mostrarResultado(
    respuesta
) {


    const caja =
        document.getElementById(
            "resultado"
        );


    caja.style.display =
        "block";


    caja.className =
        "resultado";


    if (!respuesta.ok) {

        caja.classList.add(
            "error"
        );


        document.getElementById(
            "nombre"
        ).innerText =
            respuesta.alumno || "";


        document.getElementById(
            "grupo"
        ).innerText =
            "";


        document.getElementById(
            "tipo"
        ).innerText =
            "⚠️ AVISO";


        document.getElementById(
            "hora"
        ).innerText =
            "";


        document.getElementById(
            "mensaje"
        ).innerText =
            respuesta.mensaje;


        return;
    }


    document.getElementById(
        "nombre"
    ).innerText =
        respuesta.alumno;


    document.getElementById(
        "grupo"
    ).innerText =
        "Grupo: " +
        respuesta.grupo;


    document.getElementById(
        "hora"
    ).innerText =
        respuesta.hora;


    if (
        respuesta.tipo ===
        "entrada"
    ) {

        caja.classList.add(
            "entrada"
        );


        document.getElementById(
            "tipo"
        ).innerText =
            "🟢 ENTRADA";


        document.getElementById(
            "mensaje"
        ).innerText =
            respuesta.mensaje +
            " — " +
            respuesta.estado;

    }


    else if (
        respuesta.tipo ===
        "salida"
    ) {

        caja.classList.add(
            "salida"
        );


        document.getElementById(
            "tipo"
        ).innerText =
            "🔵 SALIDA";


        document.getElementById(
            "mensaje"
        ).innerText =
            respuesta.mensaje;

    }


    else {

        caja.classList.add(
            "error"
        );


        document.getElementById(
            "tipo"
        ).innerText =
            "⚠️ AVISO";


        document.getElementById(
            "mensaje"
        ).innerText =
            respuesta.mensaje;
    }

}


/************************************************
 * ERROR DEL ESCÁNER
 ************************************************/

function errorLectura(error) {

    /*
     * Estos errores son normales mientras
     * la cámara está buscando un QR.
     */

}


/************************************************
 * MOSTRAR ERROR
 ************************************************/

function mostrarError(
    mensaje
) {

    const caja =
        document.getElementById(
            "resultado"
        );


    caja.style.display =
        "block";


    caja.className =
        "resultado error";


    document.getElementById(
        "nombre"
    ).innerText =
        "";


    document.getElementById(
        "grupo"
    ).innerText =
        "";


    document.getElementById(
        "tipo"
    ).innerText =
        "❌ ERROR";


    document.getElementById(
        "hora"
    ).innerText =
        "";


    document.getElementById(
        "mensaje"
    ).innerText =
        mensaje;

}


/************************************************
 * DETENER
 ************************************************/

async function detenerCamara() {

    if (!scanner) {
        return;
    }


    try {

        await scanner.stop();

        scanner.clear();

    } catch(error) {

        console.error(error);

    }


    scanner =
        null;

    camaraActiva =
        false;


    btnCamara.style.display =
        "block";


    btnDetener.style.display =
        "none";


    estado.innerText =
        "Cámara detenida.";


    diagnostico.innerHTML =
        "Cámara apagada.";

}


/************************************************
 * INICIALIZACIÓN
 ************************************************/

window.addEventListener(
    "load",
    function() {

        diagnostico.innerHTML =
            "Página cargada correctamente.<br>" +
            "Pulsa <b>ACTIVAR CÁMARA</b>.";

    }
);

</script>

</body>

</html>
